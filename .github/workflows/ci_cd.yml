name: CI + Continuous Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Backend lint
        run: |
          python -m compileall -q backend/src backend/tests
          ruff check backend/src backend/tests --select E9,F63,F7,F82
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm install
          npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: electricity_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d electricity_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/electricity_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Backend unit and API integration tests
        run: pytest backend/tests -v --cov=backend/src --cov-report=term-missing
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend component tests
        working-directory: frontend
        run: |
          npm install
          npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Build backend Docker image
        run: docker build -t electricity-backend:ci ./backend
      - name: Build frontend Docker image
        run: docker build -t electricity-frontend:ci ./frontend

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize repository owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/electricity-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/electricity-backend:${{ github.sha }}
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/electricity-frontend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/electricity-frontend:${{ github.sha }}
